spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routers:
          - id: customer-service-route
            uri: http://localhost:8081
            predicates:
              - Path = /api/v1/customers/**

server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/



